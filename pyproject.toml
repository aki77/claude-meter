[project]
name = "claude-meter"
version = "0.2.0"
description = "macOS menu bar app showing Claude API usage"
requires-python = ">=3.11"
dependencies = [
    "rumps>=0.4.0",
    "httpx>=0.27.0",
]

[project.scripts]
claude-meter = "claude_meter.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
